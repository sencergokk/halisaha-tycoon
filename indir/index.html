<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halı Saha Tycoon · İndir</title>
<meta name="description" content="Halı Saha Tycoon'u iPhone ve Android'e ücretsiz indir. Kendi halı sahanı kur, işlet, büyüt.">
<meta name="theme-color" content="#06100C">
<meta property="og:title" content="Halı Saha Tycoon · Ücretsiz indir">
<meta property="og:description" content="Kendi halı sahanı kur, işlet, büyüt. iPhone ve Android'de.">
<meta property="og:image" content="https://sencergokk.github.io/halisaha-tycoon/img/01_pitch_tr.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="../img/icon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root {
    --bg: #06100C; --bg-2: #0D2318; --line: rgba(241,245,241,.12);
    --text: #F1F5F1; --dim: #9BB0A2; --accent: #FFC24B; --accent-deep: #F59E0B; --ink: #1A1406;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(120% 60% at 50% 0%, #163A28 0%, var(--bg-2) 45%, var(--bg) 100%);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    min-height: 100vh; min-height: 100svh;
    max-width: 440px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3.2vh, 26px); text-align: center;
  }
  .icon {
    width: clamp(88px, 22vw, 120px); aspect-ratio: 1; border-radius: 24%;
    box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px var(--line);
  }
  h1 { font-size: clamp(28px, 8vw, 38px); line-height: 1.08; letter-spacing: -.025em; margin: 0; font-weight: 800; }
  .lead { margin: 6px 0 0; color: var(--dim); font-size: clamp(15px, 4.2vw, 17px); }
  .lead strong { color: var(--text); font-weight: 600; }
  .buttons { width: 100%; display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 66px; padding: 10px 20px; border-radius: 18px;
    text-decoration: none; text-align: left;
    background: rgba(241,245,241,.06); border: 1px solid var(--line); color: var(--text);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .btn svg { width: 30px; height: 30px; flex: none; }
  .btn span { display: block; line-height: 1.2; }
  .btn small { display: block; font-size: 13px; opacity: .75; font-weight: 500; }
  .btn b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .btn .arrow { margin-left: auto; width: 20px; height: 20px; opacity: .7; }
  .btn.primary {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-color: transparent; color: var(--ink);
    box-shadow: 0 10px 26px rgba(245,158,11,.28), inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chips li { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.22); color: #CFEFD9; }
  .more { font-size: 13px; color: var(--dim); }
  .more a { color: var(--dim); }
  @media (hover: hover) { .btn:hover { background: rgba(241,245,241,.1); } .btn.primary:hover { filter: brightness(1.05); } }
  @media (max-height: 600px) { .chips { display: none; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <img class="icon" src="../img/icon.png" alt="Halı Saha Tycoon simgesi" width="120" height="120">
  <div>
    <h1>Halı Saha Tycoon</h1>
    <p class="lead">Kendi halı sahanı kur, işlet, büyüt. <strong>Ücretsiz.</strong></p>
  </div>

  <div class="buttons">
    <a class="btn" id="ios" href="https://apps.apple.com/tr/app/id6801822720" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.77-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3.01-.79-1.55.02-2.98.9-3.78 2.29-1.61 2.8-.41 6.93 1.16 9.2.77 1.11 1.68 2.35 2.88 2.31 1.16-.05 1.59-.75 2.99-.75 1.4 0 1.79.75 3.01.72 1.24-.02 2.03-1.13 2.79-2.24.88-1.29 1.24-2.53 1.26-2.6-.03-.01-2.42-.93-2.46-3.71zM14.08 5.84c.64-.77 1.07-1.85.95-2.92-.92.04-2.03.61-2.69 1.38-.59.68-1.11 1.77-.97 2.82 1.02.08 2.07-.52 2.71-1.28z"/></svg>
      <span><small>iPhone için indir</small><b>App Store</b></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.sencergok.halisahatycoon" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D7FE" d="M3.6 2.2c-.2.2-.3.6-.3 1v17.6c0 .4.1.8.3 1l.1.1 9.8-9.8v-.2L3.7 2.1z"/><path fill="#FFCE00" d="M16.8 15.4l-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2z"/><path fill="#FF3A44" d="M16.9 15.3L13.5 12 3.6 21.8c.4.4 1 .4 1.7.1l11.6-6.6"/><path fill="#00F076" d="M16.9 8.7L5.3 2.1c-.7-.4-1.3-.3-1.7.1l9.9 9.8z"/></svg>
      <span><small>Android için indir</small><b>Google Play</b></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <ul class="chips"><li>Reklam yok</li><li>İnternet gerekmez</li><li>Türkçe</li></ul>
  <p class="more"><a href="../">Oyun hakkında</a> · <a href="../gizlilik.html">Gizlilik</a></p>
</main>
<script>
  // Ziyaretçinin cihazına uyan butonu öne çıkar (iki buton da her zaman görünür).
  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var el = isAndroid ? document.getElementById("android") : document.getElementById("ios");
    if (isIOS || isAndroid) {
      el.classList.add("primary");
      if (isAndroid) el.parentNode.insertBefore(el, el.parentNode.firstChild);
    } else {
      document.getElementById("ios").classList.add("primary");
    }
  })();
</script>
</body>
</html>
